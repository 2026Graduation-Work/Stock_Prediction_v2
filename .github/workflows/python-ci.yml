name: Python CI

# Python 영역(backend/profiling / backend/analysis/chart / backend/analysis/text / schema) 변경 시 블록별 lint + test.
# dorny/paths-filter로 변경된 블록만 해당 job을 실행한다.
# schema/** 변경은 블록 간 계약이므로 3개 job 모두 트리거.

on:
  push:
    branches: [main]
    paths:
      - "backend/profiling/**"
      - "backend/analysis/**"
      - "schema/**"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "backend/profiling/**"
      - "backend/analysis/**"
      - "schema/**"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  # ── 경로 감지 ──────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      profiling: ${{ steps.filter.outputs.profiling }}
      chart: ${{ steps.filter.outputs.chart }}
      text: ${{ steps.filter.outputs.text }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            profiling:
              - 'backend/profiling/**'
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'
            chart:
              - 'backend/analysis/chart/**'
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'
            text:
              - 'backend/analysis/text/**'
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'

  # ── profiling 블록 ─────────────────────────────────────────────────────────
  profiling-test:
    needs: changes
    if: ${{ needs.changes.outputs.profiling == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/profiling/survey
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/profiling/survey/requirements.txt
            backend/profiling/survey/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: .
        run: ruff check backend/profiling/

      - name: Run tests (pytest)
        run: pytest . -v

  # ── backend/analysis/chart 블록 ────────────────────────────────────────────────────
  chart-test:
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/analysis/chart/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/analysis/chart/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/analysis/chart/

      - name: Run tests (pytest)
        run: |
          if find backend/analysis/chart -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest backend/analysis/chart/ -v
          else
            echo "No test files in backend/analysis/chart — lint-only pass."
          fi

  # ── backend/analysis/text 블록 ─────────────────────────────────────────────────────
  text-test:
    needs: changes
    if: ${{ needs.changes.outputs.text == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/analysis/text/requirements-preprocess.txt
            backend/analysis/text/value_pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # 빅카인즈 엑셀 전처리 의존성
          pip install -r backend/analysis/text/requirements-preprocess.txt
          # value_pipeline 전용 의존성
          pip install -r backend/analysis/text/value_pipeline/requirements.txt
          # torch/transformers/requests: 루트 requirements.txt가 없으므로 CI에서 별도 설치.
          # KR-FinBERT 폴백 경로에서 사용; CPU-only 빌드로 용량을 줄인다.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers requests

      - name: Lint (ruff)
        run: ruff check backend/analysis/text/

      - name: Run tests (pytest)
        run: |
          if find backend/analysis/text -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest backend/analysis/text/ -v
          else
            echo "No test files in backend/analysis/text — lint-only pass."
          fi
