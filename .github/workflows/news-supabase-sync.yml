name: News Supabase Sync

on:
  schedule:
    # GitHub cron은 UTC 기준: 평일 00:00 UTC = 09:00 KST.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/analysis/text
    env:
      NEWSAPI_AI_KEY: ${{ secrets.NEWSAPI_AI_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/analysis/text/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-kr-finbert-${{ hashFiles('backend/analysis/text/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Collect, analyze, and persist four stocks
        run: |
          python -m value_pipeline.supabase_sync live \
            --target 005930:삼성전자 \
            --target 005380:현대차 \
            --target 035720:카카오 \
            --target 068270:셀트리온
