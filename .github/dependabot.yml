# 의존성 정기 업데이트 설정.
# 리뷰 큐를 막지 않도록 주 1회(월요일 아침, KST)로 제한하고,
# patch/minor 는 생태계별 1개 PR 로 묶는다. major 는 breaking 가능성이 있어
# 그룹에서 빠져 개별 PR 로 올라온다.
# 다만 런타임·엔진 교체 결정이 걸린 패키지는 major 를 ignore 로 막는다
# (해제 조건은 각 ignore 항목 주석 참조).
version: 2

updates:
  # ── frontend (Next.js, pnpm) ────────────────────────────────
  # pnpm-lock.yaml (lockfileVersion 9) 은 npm 생태계로 처리된다.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # major 는 사람이 판단해야 하는 결정이라 자동화에서 뺀다.
    # (minor/patch 는 그대로 받으므로 보안 패치 경로는 살아 있다)
    ignore:
      # @types/node 는 실제 Node 런타임 major 를 따라가야 한다.
      # 타입만 앞서가면 tsc 가 런타임에 없는 API 를 통과시켜 배포 후에 터진다.
      # 해제 조건: Node 런타임을 올릴 때 (web-ci.yml 의 node-version + Vercel 프로젝트
      # 설정) 이 항목을 지우고 @types/node 를 같은 major 로 함께 올린다. (#76)
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── backend (Python, requirements*.txt) ─────────────────────
  # chart / text / survey 세 블록을 한 항목으로 묶어 PR 상한을 공유한다.
  - package-ecosystem: "pip"
    directories:
      - "/backend/analysis/chart"
      - "/backend/analysis/text"
      - "/backend/profiling/survey"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # major 는 사람이 판단해야 하는 결정이라 자동화에서 뺀다.
    ignore:
      # vectorbt 1.x 는 pandas>=3.0.3 을 요구하는데 pykrx 가 pandas<3.0 이라
      # requirements.txt 가 아예 해결 불가(ResolutionImpossible)가 된다.
      # 게다가 1.x 는 API 전면 재작성이라 experiments/backtest/engine.py 도 못 쓴다.
      # 해제 조건: 백테스트 엔진 재작성을 별도 과제로 착수할 때. (#72)
      - dependency-name: "vectorbt"
        update-types:
          - "version-update:semver-major"

    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── CI 워크플로 (.github/workflows) ─────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
