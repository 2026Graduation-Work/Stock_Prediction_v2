# 의존성 정기 업데이트 설정.
# 리뷰 큐를 막지 않도록 주 1회(월요일 아침, KST)로 제한하고,
# patch/minor 는 생태계별 1개 PR 로 묶는다. major 는 breaking 가능성이 있어
# 그룹에서 빠져 개별 PR 로 올라온다.
version: 2

updates:
  # ── frontend (Next.js, pnpm) ────────────────────────────────
  # pnpm-lock.yaml (lockfileVersion 9) 은 npm 생태계로 처리된다.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── backend (Python, requirements*.txt) ─────────────────────
  # chart / text / survey 세 블록을 한 항목으로 묶어 PR 상한을 공유한다.
  - package-ecosystem: "pip"
    directories:
      - "/backend/analysis/chart"
      - "/backend/analysis/text"
      - "/backend/profiling/survey"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── CI 워크플로 (.github/workflows) ─────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
