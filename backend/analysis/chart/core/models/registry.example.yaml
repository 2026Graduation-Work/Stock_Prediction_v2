# 2025 holdout 학습을 완료한 뒤에만 이 파일을 registry.yaml로 복사한다.
# 아래 canonical 파일은 저장소에 아직 없으며 Colab notebook이 실제 산출물에서 생성한다.
models:
  aggressive:
    model_type: "h5"
    horizon_days: 5
    model_file: "baseline_h5_u175_d150_train2022_2024_holdout2025.txt"
    label:
      type: "dynamic_sigma"
      volatility_mode: "current_sigma"
      up_mult: 1.75
      down_mult: 1.50
    classes: {down: 0, neutral: 1, up: 2}
    trained_period: {start: "2022-01-01", end: "2024-12-31"}
    holdout_period: {start: "2025-01-08", end: "2025-12-31"}
    sha256: "SET_FROM_COLAB_ARTIFACT_MANIFEST"

  stable:
    model_type: "h20"
    horizon_days: 20
    model_file: "baseline_h20_u375_d300_train2022_2024_holdout2025.txt"
    label:
      type: "dynamic_sigma"
      volatility_mode: "current_sigma"
      up_mult: 3.75
      down_mult: 3.00
    classes: {down: 0, neutral: 1, up: 2}
    trained_period: {start: "2022-01-01", end: "2024-12-31"}
    holdout_period: {start: "2025-01-08", end: "2025-12-31"}
    sha256: "SET_FROM_COLAB_ARTIFACT_MANIFEST"
